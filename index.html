<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ocorrências Mandu</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 700px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text);
      text-align: center;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    textarea {
      width: 100%;
      min-height: 100px;
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      resize: vertical;
      outline: none;
    }

    textarea:focus {
      border-color: var(--primary);
    }

    .controls {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    button {
      padding: 0.75rem 1.25rem;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s, opacity 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    .btn-danger {
      background-color: var(--danger);
      color: white;
    }

    .btn-danger:hover:not(:disabled) {
      background-color: var(--danger-hover);
    }

    .status-recording {
      color: var(--danger);
      font-weight: 600;
      font-size: 0.875rem;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .pulse {
      width: 10px;
      height: 10px;
      background-color: var(--danger);
      border-radius: 50%;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.2); }
      100% { opacity: 1; transform: scale(1); }
    }

    .ocorrencias-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .item-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      position: relative;
    }

    .item-content {
      white-space: pre-line;
      line-height: 1.5;
      font-size: 0.95rem;
    }

    .item-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border);
      padding-top: 0.5rem;
      margin-top: 0.25rem;
    }

    .item-date {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.95rem;
      padding: 2rem 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Registro de Ocorrências</h1>

    <!-- Formulário de Registro -->
    <div class="card">
      <div class="form-group">
        <label for="textoOcorrencia" style="font-weight: 600;">Relato da Ocorrência:</label>
        <textarea id="textoOcorrencia" placeholder="Fale ou digite o relato da ocorrência aqui..."></textarea>
        
        <div id="statusGravacao" style="display: none;" class="status-recording">
          <span class="pulse"></span> Gravando áudio...
        </div>

        <div class="controls">
          <button id="btnGravacao" class="btn-primary" type="button" onclick="toggleGravacao()">
            🎤 Gravar Áudio
          </button>
          <button id="btnEnviar" class="btn-primary" type="button" onclick="salvarOcorrencia()">
            💾 Salvar Ocorrência
          </button>
        </div>
      </div>
    </div>

    <!-- Lista de Ocorrências Gravadas -->
    <h2 style="font-size: 1.25rem; font-weight: 600;">Ocorrências Registradas</h2>
    <div id="listaOcorrencias" class="ocorrencias-list">
      <div class="empty-state">Carregando ocorrências...</div>
    </div>
  </div>

  <script>
    let recognition = null;
    let isRecording = false;

    // Inicialização da API de reconhecimento de voz
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.lang = 'pt-BR';
      recognition.interimResults = false;

      recognition.onresult = (event) => {
        let transcript = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          transcript += event.results[i][0].transcript;
        }
        const textarea = document.getElementById('textoOcorrencia');
        textarea.value += (textarea.value ? ' ' : '') + transcript;
      };

      recognition.onerror = (event) => {
        console.error("Erro na gravação:", event.error);
        pararGravacao();
      };

      recognition.onend = () => {
        if (isRecording) {
          pararGravacao();
        }
      };
    } else {
      document.getElementById('btnGravacao').disabled = true;
      document.getElementById('btnGravacao').title = "Reconhecimento de voz não suportado neste navegador.";
    }

    function toggleGravacao() {
      if (!recognition) {
        alert("Seu navegador não suporta gravação de voz.");
        return;
      }

      if (isRecording) {
        recognition.stop();
        pararGravacao();
      } else {
        recognition.start();
        isRecording = true;
        document.getElementById('btnGravacao').textContent = '⏹ Parar Gravação';
        document.getElementById('statusGravacao').style.display = 'flex';
      }
    }

    function pararGravacao() {
      isRecording = false;
      document.getElementById('btnGravacao').textContent = '🎤 Gravar Áudio';
      document.getElementById('statusGravacao').style.display = 'none';
    }

    // Função para carregar todas as ocorrências
    async function carregarOcorrencias() {
      const listaContainer = document.getElementById('listaOcorrencias');
      try {
        const response = await fetch('/api/ocorrencias');
        if (!response.ok) throw new Error('Erro ao buscar dados');

        const ocorrencias = await response.json();

        if (!ocorrencias || ocorrencias.length === 0) {
          listaContainer.innerHTML = '<div class="empty-state">Nenhuma ocorrência registrada.</div>';
          return;
        }

        listaContainer.innerHTML = '';
        ocorrencias.forEach(item => {
          adicionarCardNaTela(item);
        });
      } catch (err) {
        console.error(err);
        listaContainer.innerHTML = '<div class="empty-state">Erro ao carregar as ocorrências.</div>';
      }
    }

    // Adiciona o elemento visual no DOM sem recarregar a página
    function adicionarCardNaTela(item, noTopo = false) {
      const listaContainer = document.getElementById('listaOcorrencias');
      
      // Remove mensagem de "vazio" caso exista
      const emptyState = listaContainer.querySelector('.empty-state');
      if (emptyState) emptyState.remove();

      const dataFormatada = item.criado_em 
        ? new Date(item.criado_em).toLocaleString('pt-BR') 
        : new Date().toLocaleString('pt-BR');

      const card = document.createElement('div');
      card.id = `ocorrencia-${item.id}`;
      card.className = 'item-card';
      card.innerHTML = `
        <div class="item-content">${item.relatorio}</div>
        <div class="item-footer">
          <span class="item-date">${dataFormatada}</span>
          <button class="btn-danger" style="padding: 0.4rem 0.8rem; font-size: 0.85rem;" onclick="deletarOcorrencia('${item.id}')">
            🗑 Excluir
          </button>
        </div>
      `;

      if (noTopo && listaContainer.firstChild) {
        listaContainer.insertBefore(card, listaContainer.firstChild);
      } else {
        listaContainer.appendChild(card);
      }
    }

    // Salva o texto/áudio e atualiza a interface imediatamente
    async function salvarOcorrencia() {
      const textarea = document.getElementById('textoOcorrencia');
      const btnEnviar = document.getElementById('btnEnviar');
      const texto = textarea.value.trim();

      if (!texto) {
        alert('Por favor, informe ou grave o relato antes de salvar.');
        return;
      }

      if (isRecording) {
        recognition.stop();
        pararGravacao();
      }

      btnEnviar.disabled = true;
      btnEnviar.textContent = 'Processando com IA...';

      try {
        const response = await fetch('/api/ocorrencias', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ textoOriginal: texto })
        });

        const result = await response.json();

        if (response.ok && result.success) {
          textarea.value = ''; // Limpa a caixa de texto
          
          // Insere a ocorrência criada direto no topo da lista na tela
          adicionarCardNaTela(result.data, true);
        } else {
          alert(result.error || 'Erro ao registrar a ocorrência.');
        }
      } catch (err) {
        console.error(err);
        alert('Erro na comunicação com o servidor.');
      } finally {
        btnEnviar.disabled = false;
        btnEnviar.textContent = '💾 Salvar Ocorrência';
      }
    }

    // Exclui a ocorrência e remove do DOM sem F5
    async function deletarOcorrencia(id) {
      if (!confirm('Deseja realmente excluir esta ocorrência?')) return;

      try {
        const response = await fetch(`/api/ocorrencias/${id}`, {
          method: 'DELETE'
        });

        if (response.ok) {
          // Remove diretamente o elemento da tela
          const elementoCard = document.getElementById(`ocorrencia-${id}`);
          if (elementoCard) {
            elementoCard.remove();
          }

          // Se ficou vazio, exibe o empty state
          const listaContainer = document.getElementById('listaOcorrencias');
          if (listaContainer.children.length === 0) {
            listaContainer.innerHTML = '<div class="empty-state">Nenhuma ocorrência registrada.</div>';
          }
        } else {
          alert('Erro ao tentar excluir a ocorrência.');
        }
      } catch (err) {
        console.error(err);
        alert('Erro de conexão ao excluir.');
      }
    }

    // Carrega a lista inicial ao abrir a página
    document.addEventListener('DOMContentLoaded', carregarOcorrencias);
  </script>
</body>
</html>
