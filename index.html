<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Livro de Ocorrências - MANDU</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
body{margin:0;background:#0f172a;color:#e2e8f0}
header{background:#1e293b;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #f59e0b}
header h1{margin:0;font-size:20px;color:#fff}
.badge{background:#f59e0b;color:#000;padding:5px 12px;border-radius:20px;font-weight:bold;font-size:12px}
.tabs{display:flex;background:#1e293b;padding:10px;gap:10px}
.tab{flex:1;padding:12px;border:none;border-radius:8px;background:#334155;color:#cbd5e1;font-weight:bold;cursor:pointer}
.tab.active{background:#f59e0b;color:#000}
.container{padding:20px;max-width:900px;margin:auto}
.card{background:#1e293b;padding:20px;border-radius:12px;margin-bottom:20px}
input,select,textarea{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #475569;background:#0f172a;color:#fff}
button.btn{background:#f59e0b;color:#000;border:none;padding:12px 20px;border-radius:8px;font-weight:bold;cursor:pointer;width:100%}
.ocorrencia{background:#0f172a;border-left:4px solid #f59e0b;padding:15px;margin:10px 0;border-radius:8px}
.ocorrencia .meta{font-size:12px;color:#94a3b8;display:flex;justify-content:space-between;flex-wrap:wrap;gap:5px}
.ocorrencia p{white-space:pre-wrap;margin:10px 0}
.del{background:#ef4444;color:#fff;border:none;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px}
.hidden{display:none}
.status{font-size:13px;color:#94a3b8;margin-top:10px}
</style>
</head>
<body>

<header>
<h1>📘 Livro de Ocorrências - MANDU</h1>
<div class="badge">TEMPO REAL</div>
</header>

<div class="tabs">
<button class="tab active" onclick="showTab('add',this)">➕ Nova</button>
<button class="tab" onclick="showTab('list',this)">📋 Ocorrências</button>
</div>

<div class="container">
<div id="tab-add" class="card">
<h3>Nova Ocorrência</h3>
<label>Hora</label>
<input type="time" id="hora">
<label>Frente / Local</label>
<select id="frente">
<option>FRENTE 1</option><option>FRENTE 2</option><option>FRENTE 3</option>
<option>TERREIRO</option><option>PORTARIA</option><option>PÁTIO</option><option>OUTROS</option>
</select>
<label>Ocorrência</label>
<textarea id="texto" rows="5" placeholder="Descreva a ocorrência..."></textarea>
<button class="btn" onclick="salvar()">SALVAR OCORRÊNCIA</button>
<div class="status" id="status"></div>
</div>

<div id="tab-list" class="card hidden">
<h3>Ocorrências Registradas</h3>
<button class="btn" onclick="carregar()" style="margin-bottom:15px">🔄 ATUALIZAR</button>
<div id="lista"></div>
</div>
</div>

<script>
const SUPABASE_URL = 'https://ecrpiuhsbhuqcxbbpqfh.supabase.co';
const SUPABASE_KEY = 'sb_publishable_I7Hw7KieW3VNFqb9LYrFoQ_tFWWABwl';
const TABLE = 'ocorrencias_mandu';
const supa = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function showTab(id, el){
 document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
 el.classList.add('active');
 document.getElementById('tab-add').classList.toggle('hidden', id!=='add');
 document.getElementById('tab-list').classList.toggle('hidden', id!=='list');
 if(id==='list') carregar();
}

function getTurnoAuto(){
 const h = new Date().getHours();
 if(h>=6 && h<14) return '1º TURNO';
 if(h>=14 && h<22) return '2º TURNO';
 return '3º TURNO';
}

async function salvar(){
 const hora = document.getElementById('hora').value;
 const frente = document.getElementById('frente').value;
 const texto = document.getElementById('texto').value.trim();
 if(!hora || !texto){ alert('Preencha hora e ocorrência'); return; }
 document.getElementById('status').textContent = 'Salvando...';
 const { error } = await supa.from(TABLE).insert([{hora, frente, texto, turno: getTurnoAuto(), unidade:'MANDU'}]);
 if(error){ document.getElementById('status').textContent = 'Erro: '+error.message; }
 else{
  document.getElementById('status').textContent = 'Salvo com sucesso!';
  document.getElementById('hora').value=''; document.getElementById('texto').value='';
  carregar();
 }
}

async function carregar(){
 const lista = document.getElementById('lista');
 lista.innerHTML = 'Carregando...';
 const { data, error } = await supa.from(TABLE).select('*').order('created_at',{ascending:false}).limit(200);
 if(error){ lista.innerHTML = 'Erro: '+error.message; return; }
 if(!data.length){ lista.innerHTML = 'Nenhuma ocorrência.'; return; }
 lista.innerHTML = data.map(o=>`
  <div class="ocorrencia">
   <div class="meta"><span>⏰ ${o.hora} | ${o.turno||''}</span><span>📍 ${o.frente}</span><span>${new Date(o.created_at).toLocaleString('pt-BR')}</span></div>
   <p>${o.texto}</p>
   <button class="del" onclick="excluir('${o.id}')">Excluir</button>
  </div>`).join('');
}

async function excluir(id){
 if(!confirm('Excluir?')) return;
 await supa.from(TABLE).delete().eq('id',id);
 carregar();
}

// tempo real
supa.channel('mandu-rt').on('postgres_changes',{event:'*',schema:'public',table:TABLE},()=>carregar()).subscribe();

carregar();
</script>
</body>
</html>
