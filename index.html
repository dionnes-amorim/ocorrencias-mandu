<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão de Ocorrências Mandu - IA Gemini</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .hero-card { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: white; border-radius: 15px; }
    .record-btn {
      width: 90px; height: 90px; border-radius: 50%;
      font-size: 32px; display: flex; align-items: center; justify-content: center;
      transition: all 0.2s ease-in-out; border: 4px solid #ffffff; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    .record-btn.recording { background-color: #dc3545 !important; animation: pulse 1.2s infinite; }
    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(220, 53, 69, 0.7); }
      70% { transform: scale(1.08); box-shadow: 0 0 0 15px rgba(220, 53, 69, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(220, 53, 69, 0); }
    }
    .card-occurrence { border: none; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); transition: transform 0.2s; }
    .card-occurrence:hover { transform: translateY(-3px); }
  </style>
</head>
<body>

<div class="container py-4">
  <!-- Topo -->
  <div class="hero-card p-4 mb-4 shadow text-center">
    <h2><i class="bi bi-shield-check me-2"></i> Central de Ocorrências Mandu</h2>
    <p class="mb-3 text-white-50">Grave um áudio ou segure o botão para descrever uma ocorrência. A IA analisa e gera os registros em tempo real.</p>
    
    <!-- Botão com dual mode (Segurar ou Clicar) -->
    <div class="d-flex flex-column align-items-center">
      <button id="micBtn" class="btn btn-danger record-btn mb-2">
        <i class="bi bi-mic-fill"></i>
      </button>
      <span id="recordingStatus" class="badge bg-light text-dark px-3 py-2">Clique ou Segure para Gravar</span>
    </div>
  </div>

  <!-- Filtro / Busca -->
  <div class="row mb-3 align-items-center">
    <div class="col-md-8">
      <h4><i class="bi bi-journal-text me-2"></i> Ocorrências Registradas</h4>
    </div>
    <div class="col-md-4">
      <input type="text" id="searchInput" class="form-control" placeholder="Buscar por título ou descrição..." onkeyup="filterOccurrences()">
    </div>
  </div>

  <!-- Loading spinner -->
  <div id="loader" class="text-center d-none my-4">
    <div class="spinner-border text-primary" role="status"></div>
    <p class="mt-2 text-muted">A IA Gemini está processando seu áudio...</p>
  </div>

  <!-- Lista de Ocorrências -->
  <div id="occurrencesList" class="row g-3">
    <!-- Renderizado dinamicamente -->
  </div>
</div>

<!-- Modal de Edição -->
<div class="modal fade" id="editModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Editar Ocorrência</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="editForm">
          <input type="hidden" id="editId">
          <div class="mb-3">
            <label class="form-label">Título</label>
            <input type="text" id="editTitulo" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Descrição</label>
            <textarea id="editDescricao" class="form-control" rows="3" required></textarea>
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">Local</label>
              <input type="text" id="editLocal" class="form-control">
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Gravidade</label>
              <select id="editGravidade" class="form-select">
                <option value="Baixa">Baixa</option>
                <option value="Média">Média</option>
                <option value="Alta">Alta</option>
              </select>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" onclick="saveEdit()">Salvar Alterações</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  let mediaRecorder;
  let audioChunks = [];
  let isRecording = false;
  let holdTimer = null;
  let occurrencesData = [];
  let editModalInstance;

  document.addEventListener('DOMContentLoaded', () => {
    editModalInstance = new bootstrap.Modal(document.getElementById('editModal'));
    loadOccurrences();
    setupHoldToTalk();
  });

  // Configuração Hold-to-Talk & Click-to-Talk
  function setupHoldToTalk() {
    const btn = document.getElementById('micBtn');

    // Suporte para Mouse
    btn.addEventListener('mousedown', startHoldRecording);
    btn.addEventListener('mouseup', stopHoldRecording);
    btn.addEventListener('mouseleave', stopHoldRecording);

    // Suporte para Touch (Dispositivos Móveis)
    btn.addEventListener('touchstart', (e) => { e.preventDefault(); startHoldRecording(); });
    btn.addEventListener('touchend', (e) => { e.preventDefault(); stopHoldRecording(); });
  }

  function startHoldRecording() {
    if (isRecording) return;
    holdTimer = setTimeout(() => {
      startRecording();
    }, 200); // Pequeno atraso para diferenciar clique rápido de pressionar
  }

  function stopHoldRecording() {
    if (holdTimer) clearTimeout(holdTimer);
    if (isRecording) {
      stopRecording();
    }
  }

  async function startRecording() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];

      mediaRecorder.ondataavailable = (event) => {
        if (event.data.size > 0) audioChunks.push(event.data);
      };

      mediaRecorder.onstop = sendAudioToServer;

      mediaRecorder.start();
      isRecording = true;
      updateUIState(true);
    } catch (err) {
      alert("Permissão de microfone negada ou indisponível.");
    }
  }

  function stopRecording() {
    if (mediaRecorder && isRecording) {
      mediaRecorder.stop();
      isRecording = false;
      updateUIState(false);
      
      // Para as faixas de áudio para desligar o microfone
      mediaRecorder.stream.getTracks().forEach(track => track.stop());
    }
  }

  function updateUIState(recording) {
    const btn = document.getElementById('micBtn');
    const status = document.getElementById('recordingStatus');
    if (recording) {
      btn.classList.add('recording');
      status.textContent = "Gravando... Solte ou clique para enviar.";
      status.className = "badge bg-danger text-white px-3 py-2";
    } else {
      btn.classList.remove('recording');
      status.textContent = "Clique ou Segure para Gravar";
      status.className = "badge bg-light text-dark px-3 py-2";
    }
  }

  async function sendAudioToServer() {
    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
    const formData = new FormData();
    formData.append('audio', audioBlob, 'rec.webm');

    document.getElementById('loader').classList.remove('d-none');

    try {
      const res = await fetch('/api/transcribe-occurrences', {
        method: 'POST',
        body: formData
      });
      const data = await res.json();
      if (data.success) {
        loadOccurrences(); // Atualiza a lista instantaneamente
      } else {
        alert("Erro no processamento da IA: " + (data.error || "Erro desconhecido"));
      }
    } catch (e) {
      alert("Falha de conexão com o servidor.");
    } finally {
      document.getElementById('loader').classList.add('d-none');
    }
  }

  // Carregar e listar ocorrências
  async function loadOccurrences() {
    try {
      const res = await fetch('/api/ocorrencias');
      occurrencesData = await res.json();
      renderOccurrences(occurrencesData);
    } catch (e) {
      console.error("Erro ao carregar registros:", e);
    }
  }

  function renderOccurrences(list) {
    const container = document.getElementById('occurrencesList');
    container.innerHTML = '';

    if (list.length === 0) {
      container.innerHTML = `<div class="text-center text-muted py-5"><i class="bi bi-inbox fs-1"></i><p>Nenhuma ocorrência registrada ainda.</p></div>`;
      return;
    }

    list.forEach(item => {
      const badgeClass = item.gravidade === 'Alta' ? 'bg-danger' : item.gravidade === 'Média' ? 'bg-warning text-dark' : 'bg-info text-dark';
      
      const col = document.createElement('div');
      col.className = 'col-md-6 col-lg-4';
      col.innerHTML = `
        <div class="card card-occurrence h-100">
          <div class="card-body d-flex flex-column">
            <div class="d-flex justify-content-between align-items-start mb-2">
              <h5 class="card-title text-primary mb-0">${item.titulo || 'Ocorrência'}</h5>
              <span class="badge ${badgeClass}">${item.gravidade || 'Baixa'}</span>
            </div>
            <p class="card-text text-secondary flex-grow-1">${item.descricao}</p>
            <div class="border-top pt-2 mt-2 fs-7 text-muted small">
              <div><i class="bi bi-geo-alt"></i> ${item.local || 'N/A'}</div>
              <div><i class="bi bi-clock"></i> ${item.dataHora || 'Data não informada'}</div>
            </div>
            <div class="d-flex gap-2 mt-3 pt-2 border-top">
              <button class="btn btn-sm btn-outline-primary w-50" onclick="openEditModal('${item.id}')"><i class="bi bi-pencil"></i> Editar</button>
              <button class="btn btn-sm btn-outline-danger w-50" onclick="deleteOccurrence('${item.id}')"><i class="bi bi-trash"></i> Excluir</button>
            </div>
          </div>
        </div>
      `;
      container.appendChild(col);
    });
  }

  // Editar
  function openEditModal(id) {
    const item = occurrencesData.find(o => o.id === id);
    if (!item) return;

    document.getElementById('editId').value = item.id;
    document.getElementById('editTitulo').value = item.titulo || '';
    document.getElementById('editDescricao').value = item.descricao || '';
    document.getElementById('editLocal').value = item.local || '';
    document.getElementById('editGravidade').value = item.gravidade || 'Baixa';

    editModalInstance.show();
  }

  async function saveEdit() {
    const id = document.getElementById('editId').value;
    const body = {
      titulo: document.getElementById('editTitulo').value,
      descricao: document.getElementById('editDescricao').value,
      local: document.getElementById('editLocal').value,
      gravidade: document.getElementById('editGravidade').value,
    };

    try {
      const res = await fetch(`/api/ocorrencias/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      if (res.ok) {
        editModalInstance.hide();
        loadOccurrences(); // Atualiza os registros no painel
      }
    } catch (e) {
      alert("Erro ao atualizar ocorrência.");
    }
  }

  // Excluir
  async function deleteOccurrence(id) {
    if (!confirm("Deseja realmente excluir esta ocorrência?")) return;
    try {
      const res = await fetch(`/api/ocorrencias/${id}`, { method: 'DELETE' });
      if (res.ok) {
        loadOccurrences(); // Atualiza lista
      }
    } catch (e) {
      alert("Erro ao remover ocorrência.");
    }
  }

  // Filtro
  function filterOccurrences() {
    const term = document.getElementById('searchInput').value.toLowerCase();
    const filtered = occurrencesData.filter(item => 
      (item.titulo && item.titulo.toLowerCase().includes(term)) ||
      (item.descricao && item.descricao.toLowerCase().includes(term)) ||
      (item.local && item.local.toLowerCase().includes(term))
    );
    renderOccurrences(filtered);
  }
</script>

</body>
</html>
